# Nginx server block for hosting Unfold on a computer lab server (Linux or Windows Nginx + PHP-FPM).
server {
    listen 80;
    server_name _;

    root /var/www/unfold;
    index index.php index.html;

    # Allow 3D world recording uploads up to 16 GB and project ZIPs up to 1 GB.
    client_max_body_size 16G;
    proxy_read_timeout 600s;
    fastcgi_read_timeout 600s;

    # Hard-block private ZIPs, world outputs, and worker logs.
    location ^~ /wp-content/unfold-private/ {
        deny all;
        return 403;
    }

    # Block public user enumeration.
    location ~* ^/wp-json/wp/v2/users {
        deny all;
        return 403;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass 127.0.0.1:9000;
    }
}
